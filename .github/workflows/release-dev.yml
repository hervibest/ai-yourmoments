name: Release Dev

on:
  push:
    tags:
      - "*-dev.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: hervibest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      # ======================
      # ai-svc
      # ======================
      - name: Build & Push ai-svc
        run: |
           docker build \
            -f Dockerfile \
            -t $REGISTRY/$IMAGE_NAMESPACE/ai-svc:$VERSION .
           docker push $REGISTRY/$IMAGE_NAMESPACE/ai-svc:$VERSION

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      APP_VERSION: ${{ github.ref_name }}
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: hervibest

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF

          set -euo pipefail

          cd /home/ubuntu/app/ai-yourmoments

          grep -q "^APP_VERSION=" .env.development && \
            sed -i "s|^APP_VERSION=.*|APP_VERSION=${APP_VERSION}|" .env.development || \
            echo "APP_VERSION=${APP_VERSION}" >> .env.development 

          echo "🔐 Login to GHCR"
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login ${REGISTRY} \
            -u hervibest \
            --password-stdin

          echo "📦 Pull images"
          docker compose -f docker-compose.dev.yaml pull

          echo "🛑 Stop containers"
          docker compose -f docker-compose.dev.yaml down

          echo "🚀 Start containers"
          docker compose -f docker-compose.dev.yaml up -d

          echo "🧹 Cleanup images"
          docker image prune -f

          echo "✅ Deploy finished"
          EOF
